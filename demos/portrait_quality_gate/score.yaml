# Score-only recipe: keep all samples so thresholds can be audited before filtering.
project_name: portrait-hard-quality-score
dataset_path: /path/to/input.jsonl
export_path: ./outputs/portrait-hard-quality/scored.jsonl

np: 4
# Data-Juicer's generic formatter requires a non-empty primary text column.
# The image gate does not consume it; use the source caption or a fixed
# placeholder for image-only raw data.
text_keys: text
image_key: images
image_bytes_key: image_bytes
skip_op_error: false
keep_stats_in_res_ds: true

process:
  - s3_download_file_mapper:
      download_field: images
      save_dir: /tmp/data_juicer_portrait_cache
      source_field: source_images
      resume_download: true
      max_concurrent: 8
      preserve_s3_paths: true
      s3_backend: aoss
      aoss_config_env: AOSS_CONF

  - image_portrait_quality_mapper:
      # Data-Juicer batch size and the maximum YOLO inference micro-batch.
      # Start with 8 and increase after checking GPU memory.
      batch_size: 8
      inference_batch_size: 8
      detect_people: true
      detect_faces_enabled: true
      detect_pose: true
      require_human: true
      yolo_model_path: yolo11n.pt
      yolo_pose_model_path: yolo11n-pose.pt
      person_confidence: 0.35
      strong_person_confidence: 0.55
      pose_confidence: 0.35
      pose_keypoint_confidence: 0.35
      min_pose_keypoints: 4
      clear_face_area_ratio_min: 0.01
      clear_face_sharpness_min: 20.0
      edge_margin_ratio: 0.01
      partial_person_width_height_ratio_min: 1.5
      max_analysis_side: 1024
      # Blur rejection is disabled until calibrated on project data.
      min_sharpness_score: 0.0
